<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learn Time embed demo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #1f2a21; color: #fcf0c6; font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #c9c3a4; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-start; }
  .row > * { margin: 0 24px 24px 0; }
  .tile { width: 200px; background: #29362a; border-radius: 16px; padding: 12px; }
  .tile.big { width: 320px; }
  .tile.themed { --lt-bg: #f6efe0; --lt-face: #fffaf0; --lt-cream: #3a3226; --lt-panel: #e8dcc4; --lt-ink: #2b241b; }
  .cap { font-size: 13px; color: #c9c3a4; margin-top: 8px; }
  #log { background: #141c16; border-radius: 12px; padding: 12px; font: 12px/1.5 ui-monospace, monospace; min-height: 80px; white-space: pre-wrap; }
  .overlay { position: fixed; inset: 0; top: 0; left: 0; right: 0; bottom: 0; z-index: 10; }
  .overlay learn-time { width: 100%; height: 100%; }
</style>
<script type="module" src="embed.js"></script>
</head>
<body>
<main>
  <h1>&lt;learn-time&gt; embed demo</h1>
  <p>Face mode at the widths HLC uses. Tap a face to open full mode, and use the close button to come back. Events are logged below.</p>
  <div class="row">
    <div class="tile"><learn-time id="face" mode="face" contract="1"></learn-time><div class="cap">200 px, HLC routine, events, Toronto location</div></div>
    <div class="tile big"><learn-time mode="face" contract="1"></learn-time><div class="cap">320 px, built-in defaults</div></div>
    <div class="tile themed"><learn-time mode="face" contract="1"></learn-time><div class="cap">Themed with --lt-* properties</div></div>
    <div class="tile"><learn-time mode="face" contract="2"></learn-time><div class="cap">contract="2": refused, fires lt-error</div></div>
  </div>
  <div id="log"></div>
</main>
<script>
  var log = document.getElementById('log');
  function note(msg) { log.textContent = new Date().toLocaleTimeString() + '  ' + msg + '\n' + log.textContent; }
  ['lt-ready', 'lt-open', 'lt-close', 'lt-error'].forEach(function (t) {
    document.addEventListener(t, function (e) { note(t + ' ' + JSON.stringify(e.detail)); });
  });

  // What HLC would pass: its own routine, today's events and home location.
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  var soon = new Date(Date.now() + 90 * 60000);
  var hlc = {
    routine: [
      { id: 'sunrise' }, { id: 'breakfast', time: '07:30' }, { id: 'lunch', time: '12:00' },
      { id: 'sunset' }, { id: 'dinner', time: '17:45' }, { id: 'bedtime', time: '19:30' }
    ],
    events: [{ title: 'Swimming', start: soon.toISOString(), iconUrl: null }],
    location: { lat: 43.65, lng: -79.38 }
  };
  var face = document.getElementById('face');
  face.routine = hlc.routine;
  face.events = hlc.events;
  face.location = hlc.location;

  document.addEventListener('lt-open', function (e) {
    var src = e.target;
    var ov = document.createElement('div');
    ov.className = 'overlay';
    var full = document.createElement('learn-time');
    full.setAttribute('mode', 'full');
    full.setAttribute('contract', '1');
    if (src === face) { full.routine = hlc.routine; full.events = hlc.events; full.location = hlc.location; }
    ov.appendChild(full);
    document.body.appendChild(ov);
    full.addEventListener('lt-close', function () { ov.parentNode.removeChild(ov); });
  });
</script>
</body>
</html>
