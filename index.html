<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#29362a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Learn Time</title>
<meta name="description" content="A toy clock that helps kids learn to tell the time. Drag the hands, take a quiz, and see when sunrise, lunch and dinner happen.">
<link rel="icon" id="favicon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Learn Time">
<meta property="og:description" content="A toy clock that helps kids learn to tell the time.">
<meta property="og:url" content="https://ryan-dot-business.github.io/learn-time/">
<meta property="og:image" content="https://ryan-dot-business.github.io/learn-time/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Learn Time: a clock face at 1:41 beside the words Learn Time.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://ryan-dot-business.github.io/learn-time/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800&display=swap">
<style>
  html, body { height: 100%; margin: 0; background: #29362a; }
  html { box-sizing: border-box; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  learn-time { display: block; width: 100%; height: 100%; }
  .nojs { color: #fcf0c6; font: 700 18px/1.4 Figtree, system-ui, sans-serif; text-align: center; padding: 40px 16px; }
</style>
<script type="module" src="embed.js"></script>
</head>
<body>
<!-- The standalone site is the same <learn-time> element HLC embeds, in full mode without a close button. -->
<learn-time mode="full" contract="1" no-close></learn-time>
<noscript><p class="nojs">Learn Time needs JavaScript to run.</p></noscript>
<script>
  // Favicon: the real current hour on a dark tile, redrawn when the hour changes.
  (function () {
    var link = document.getElementById('favicon'), shown = null;
    function draw() {
      var h = new Date().getHours() % 12 || 12;
      if (h === shown) return;
      var cv = document.createElement('canvas');
      cv.width = cv.height = 64;
      var g = cv.getContext && cv.getContext('2d');
      if (!g) return;
      g.fillStyle = '#29372c';
      g.beginPath();
      if (g.roundRect) g.roundRect(0, 0, 64, 64, 11); else g.rect(0, 0, 64, 64);
      g.fill();
      g.fillStyle = '#f7f2d8';
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.font = '800 ' + (h >= 10 ? 38 : 44) + 'px Figtree, "Helvetica Neue", Arial, sans-serif';
      g.fillText(String(h), 32, 35);
      link.type = 'image/png';
      link.href = cv.toDataURL('image/png');
      shown = h;
    }
    var fonts = document.fonts && document.fonts.load ? document.fonts.load('800 38px Figtree') : null;
    if (fonts) fonts.then(draw, draw); else draw();
    setInterval(draw, 30000);
  })();
</script>
</body>
</html>
